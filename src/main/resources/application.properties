spring.application.name=denunciaservice

server.port=${PORT:8080}

# Por defecto corre en local con H2 en memoria.
# En Render.com configure DB_URL, DB_USER y DB_PASSWORD (PostgreSQL/MySQL).
spring.datasource.url=${DB_URL:jdbc:h2:mem:denuncias}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Serializar fechas como texto ISO-8601 (no arrays) para que el front (Gson) las parsee como String
spring.jackson.serialization.write-dates-as-timestamps=false
